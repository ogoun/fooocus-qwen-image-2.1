# Правила статической проверки. Набор узкий намеренно: ошибки (F, E9, B),
# порядок импортов (I) и устаревшие конструкции (UP) — то, что ловит дефекты
# и держит единообразие, без стилистических споров.
target-version = "py310"
line-length = 120
extend-exclude = ["Qwen-Image-2.1", "user", "logs"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = [
    # Инструменты кладут корень проекта в sys.path до импорта пакета, тесты
    # импортируют gradio через pytest.importorskip — импорт не в начале файла
    # там намеренный.
    "E402",
    # gr.Progress() в значении по умолчанию — штатный способ Gradio передать
    # индикатор хода в обработчик.
    "B008",
    # Опыты замеряют функции, объявленные в цикле и вызываемые в нём же.
    "B023",
    # zip(strict=...) — только где длины обязаны совпасть; остальное шум.
    "B905",
    "UP007",
]

[lint.isort]
known-first-party = ["fooocus_qwen"]
